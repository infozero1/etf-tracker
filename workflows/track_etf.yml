name: Track ETF returns daily

on:
  schedule:
    - cron: "30 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas xlsxwriter

      - name: Run tracking script
        run: |
          python track_etf_returns.py

      - name: Build Excel chart
        run: |
          python build_excel_chart.py

           - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_returns_history.csv grafico_portafoglio.xlsx
          git diff --staged --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Update ETF history and Excel chart [skip ci]"
          git push --force-with-lease origin main
